<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Indeed Test Job</title>
  </head>
  <body>
    <main>
      <h2 class="jobsearch-JobInfoHeader-title" data-testid="jobsearch-JobInfoHeader-title">
        <span>Senior Software Engineer</span>
        <span> - job post</span>
      </h2>

      <div data-testid="inlineHeader-companyName" data-company-name="true">
        <a href="/cmp/ImageSource,-Inc./jobs">ImageSource, Inc.</a>
      </div>

      <div data-testid="inlineHeader-companyLocation">
        <div data-testid="job-location">Olympia, WA 98501</div>
      </div>

      <div id="salaryInfoAndJobType">
        <span>$95,000 - $115,000 a year</span>
        <span> - Full-time</span>
      </div>

      <div id="jobDescriptionText" class="jobsearch-JobComponent-description">
        <p><strong>About the role</strong></p>
        <p>This hybrid position supports statewide systems.</p>
        <ul>
          <li>Lead technical projects</li>
          <li>Collaborate with remote teams</li>
        </ul>
      </div>
    </main>
  </body>
</html>
